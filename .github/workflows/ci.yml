name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Run Rust linter
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  release:
    name: Semantic Release
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/github \
            @semantic-release/git \
            @semantic-release/release-notes-generator \
            conventional-changelog-conventionalcommits

      - name: Generate release and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

  upload-artifacts:
    name: Build and Upload Release Binaries
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: Settlers4LinuxPatcher-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            archive: Settlers4LinuxPatcher-linux-aarch64.tar.gz
            install_linker: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: get_tag
        run: |
          git fetch --tags --force
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "no_tag=true" >> "$GITHUB_OUTPUT"
            echo "No release tag found; skipping artifact build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "no_tag=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        if: steps.get_tag.outputs.no_tag != 'true'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y \
              libxcb1-dev:arm64 \
              libxcb-render0-dev:arm64 \
              libxcb-shape0-dev:arm64 \
              libxcb-xfixes0-dev:arm64 \
              libxkbcommon-dev:arm64 \
              libwayland-dev:arm64 \
              pkg-config
          else
            sudo apt-get install -y \
              libxcb1-dev \
              libxcb-render0-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev \
              libxkbcommon-dev \
              libwayland-dev \
              pkg-config
          fi

      - name: Install Rust toolchain
        if: steps.get_tag.outputs.no_tag != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 linker
        if: matrix.install_linker && steps.get_tag.outputs.no_tag != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust dependencies
        if: steps.get_tag.outputs.no_tag != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        if: steps.get_tag.outputs.no_tag != 'true'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        if: steps.get_tag.outputs.no_tag != 'true'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/Settlers4LinuxPatcher artifacts/Settlers4LinuxPatcher
          cd artifacts
          tar -czf ${{ matrix.archive }} Settlers4LinuxPatcher

      - name: Upload binary to release
        if: steps.get_tag.outputs.no_tag != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: artifacts/${{ matrix.archive }}
