name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Run Rust linter
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  release:
    name: Semantic Release
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/github \
            @semantic-release/git \
            @semantic-release/release-notes-generator \
            conventional-changelog-conventionalcommits

      - name: Generate release and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

  upload-artifacts:
    name: Build and Upload Release Binaries
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: get_tag
        run: |
          git fetch --tags --force
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "no_tag=true" >> "$GITHUB_OUTPUT"
            echo "No release tag found; skipping artifact build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "no_tag=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        if: steps.get_tag.outputs.no_tag != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Install Rust toolchain
        if: steps.get_tag.outputs.no_tag != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.get_tag.outputs.no_tag != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        if: steps.get_tag.outputs.no_tag != 'true'
        run: cargo build --release

      - name: Package binary
        if: steps.get_tag.outputs.no_tag != 'true'
        run: |
          mkdir -p artifacts
          cp target/release/Settlers4LinuxPatcher artifacts/Settlers4LinuxPatcher
          cd artifacts
          tar -czf Settlers4LinuxPatcher-linux-x86_64.tar.gz Settlers4LinuxPatcher

      - name: Upload binary to release
        if: steps.get_tag.outputs.no_tag != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: artifacts/Settlers4LinuxPatcher-linux-x86_64.tar.gz
